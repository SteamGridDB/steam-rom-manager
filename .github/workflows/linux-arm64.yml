name: Experimental Linux ARM64 release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-linux-arm64*"

permissions:
  contents: write

jobs:
  build-linux-arm64:
    name: Build Linux ARM64 artifacts
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools rpm
          npm install --global yarn@1.22
          yarn install --frozen-lockfile

      - name: Build application
        run: |
          git lfs pull
          yarn run presets:validate
          yarn run build:dist
          yarn run build:linux-arm64
        env:
          SENTRY_AUTH: ${{ secrets.SENTRY_AUTH }}

      - name: Verify ARM64 artifacts
        run: |
          file release/Steam-ROM-Manager-*-linux-arm64.AppImage
          file release/Steam-ROM-Manager-*-linux-arm64.tar.gz
          file release/linux-arm64-unpacked/steam-rom-manager

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: steam-rom-manager-linux-arm64
          path: |
            release/Steam-ROM-Manager-*-linux-arm64.AppImage
            release/Steam-ROM-Manager-*-linux-arm64.tar.gz

      - name: Attach artifacts to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            release/Steam-ROM-Manager-*-linux-arm64.AppImage
            release/Steam-ROM-Manager-*-linux-arm64.tar.gz
